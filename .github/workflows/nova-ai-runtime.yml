name: Nova AI runtime reduction
on:
  push:
    branches: [main]
    paths: ['.github/workflows/nova-ai-runtime.yml']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Apply and verify
        shell: bash
        run: |
          printf '%s' '' | base64 -d | gzip -d >/tmp/nova.patch
          git apply --check /tmp/nova.patch
          git apply /tmp/nova.patch
          rm -f .github/workflows/nova-ai-runtime.yml
          node --check _worker.js
          node --check website/js/nova-v7-api.js
          node --check website/js/social.js
          node --check website/js/nova-uno.js
          node --check website/js/nova-social-vc.js
          bash -n scripts/deploy/deploy-pages-turso.sh
          git config user.name 'Connor'
          git config user.email 'conmancloss@gmail.com'
          git add -A
          git commit -m 'pushed by Connor via deploy-ai.sh'
          git push origin main
