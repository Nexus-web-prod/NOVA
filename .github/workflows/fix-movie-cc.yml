name: Validate Nova Movies CC

on:
  push:
    paths:
      - '.github/workflows/fix-movie-cc.yml'
      - 'website/js/nova-movies.js'
      - 'website/js/nova-live-cc.js'
      - 'website/data/movies.json'
      - 'website/html/index.html'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate movie catalog
        shell: bash
        run: |
          python -m json.tool website/data/movies.json >/dev/null
          echo "movies.json is valid"

      - name: Validate movie CC implementation
        shell: bash
        run: |
          test -f website/js/nova-movies.js
          grep -q "function clearMovieCaptions(video)" website/js/nova-movies.js
          grep -q "function applyMovieCaptions(video, movie)" website/js/nova-movies.js
          grep -q "function captionTracks(video)" website/js/nova-movies.js
          grep -q "function captionAvailable(video, movie)" website/js/nova-movies.js
          grep -q "function syncCaptionButton(video, movie)" website/js/nova-movies.js
          grep -q "function toggleMovieCaptions(video, movie)" website/js/nova-movies.js
          grep -q "movies-player-cc" website/js/nova-movies.js
          grep -q "function syncLiveCaptionState(video, movie)" website/js/nova-movies.js
          grep -q "function toggleLiveMovieCaptions(video, movie)" website/js/nova-movies.js
          grep -q "NovaLiveCC" website/js/nova-movies.js
          test -f website/js/nova-live-cc.js
          test -f website/js/nova-live-cc-worker.js
          test -f website/js/nova-live-cc-worklet.js
          grep -q "window.NovaLiveCC" website/js/nova-live-cc.js
          grep -q "automatic-speech-recognition" website/js/nova-live-cc.js
          echo "Movie CC and Live CC implementation is present"

      - name: Validate movie HTML asset version
        shell: bash
        run: |
          grep -q 'nova-live-cc.js?v=20261003-live-cc-r7' website/html/index.html
          grep -q 'nova-movies.js?v=20261003-cc-r5' website/html/index.html
          echo "Movie JS and Live CC asset versions are current"

      - name: Validate Burrito Bison
        shell: bash
        run: |
          python - <<'PY'
          import json
          with open("website/data/games.json", encoding="utf-8") as f:
              games = json.load(f)
          game = next((g for g in games if g.get("name") == "Burrito Bison"), None)
          assert game, "Burrito Bison is missing from games.json"
          assert game.get("url") == "https://burritobisononline.gitlab.io/file/", "Burrito Bison URL is incorrect"
          print("Burrito Bison entry is valid")
          PY

      - name: Summary
        run: echo "Nova Movies CC validation passed"
