<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#05050b">
  <title>Games Player — Nova</title>
  <script>
    (function(){var slug=new URLSearchParams(location.search).get('game');if(slug)location.replace('/website/html/index.html?gamePlayer='+encodeURIComponent(slug));else location.replace('/website/html/index.html?page=game-player');}());
  </script>
  <style>
    :root {
      --player-bg: #05050b;
      --player-surface: rgba(15, 15, 29, 0.94);
      --player-surface-hover: rgba(29, 29, 52, 0.98);
      --player-border: rgba(255, 255, 255, 0.14);
      --player-text: #f7f7ff;
      --player-muted: #b8b8ca;
      --player-accent: #8b8fff;
      --player-ring: #b8baff;
      --player-danger: #ff8585;
      --player-shadow: 0 20px 60px rgba(0, 0, 0, 0.48);
      --ease-out: cubic-bezier(.2, .8, .2, 1);
    }

    * { box-sizing: border-box; }

    html,
    body {
      width: 100%;
      min-height: 100%;
      margin: 0;
      overflow: hidden;
      background: var(--player-bg);
      color: var(--player-text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    button { font: inherit; }

    .player {
      position: fixed;
      inset: 0;
      min-height: 100dvh;
      background:
        radial-gradient(circle at 50% 15%, rgba(139, 143, 255, 0.10), transparent 38%),
        var(--player-bg);
    }

    .game-frame {
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
      background: #000;
    }

    .loading,
    .error-state {
      position: absolute;
      inset: 0;
      z-index: 20;
      display: grid;
      place-items: center;
      padding: 24px;
      background: var(--player-bg);
      transition: opacity 180ms var(--ease-out), visibility 180ms var(--ease-out);
    }

    .loading.is-hidden,
    .error-state[hidden] {
      visibility: hidden;
      opacity: 0;
      pointer-events: none;
    }

    .loading-card,
    .error-card {
      display: grid;
      justify-items: center;
      gap: 16px;
      max-width: 420px;
      text-align: center;
    }

    .nova-mark,
    .launcher-mark {
      width: 30px;
      height: 30px;
      color: var(--player-accent);
    }

    .loading h1,
    .error-state h1 {
      margin: 0;
      font-size: clamp(20px, 3vw, 28px);
      line-height: 1.2;
    }

    .loading p,
    .error-state p {
      margin: 0;
      color: var(--player-muted);
      line-height: 1.55;
    }

    .progress-track {
      width: min(260px, 72vw);
      height: 4px;
      overflow: hidden;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.1);
    }

    .progress-bar {
      width: 46%;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, var(--player-accent), #c4a7ff);
      animation: load 1.2s var(--ease-out) infinite alternate;
    }

    .launcher {
      position: fixed;
      top: max(16px, env(safe-area-inset-top));
      right: max(16px, env(safe-area-inset-right));
      z-index: 60;
      display: grid;
      place-items: center;
      width: 46px;
      height: 46px;
      padding: 0;
      border: 0;
      border-radius: 50%;
      color: var(--player-text);
      background: linear-gradient(135deg, var(--player-accent), #5d5df6);
      box-shadow: 0 4px 20px rgba(93, 93, 246, 0.4);
      cursor: pointer;
      transition: background-color 160ms ease, border-color 160ms ease, transform 100ms ease;
      touch-action: manipulation;
      animation: island-pulse 2.5s ease-in-out infinite;
    }

    .island-dock { position: fixed; z-index: 70; top: max(16px, env(safe-area-inset-top)); right: max(16px, env(safe-area-inset-right)); display: flex; align-items: center; gap: 5px; padding: 5px; border: 1px solid transparent; border-radius: 999px; transition: opacity 180ms ease, background 180ms ease, border-color 180ms ease; }
    .island-dock .launcher { position: static; }
    .island-dock.is-near { background: rgba(10,10,22,.86); border-color: var(--player-border); backdrop-filter: blur(18px); box-shadow: var(--player-shadow); }
    .island-dock.is-captured { opacity: .15; pointer-events: none; }
    .quick-controls { display: none; gap: 4px; }
    .island-dock.is-near .quick-controls, .island-dock:focus-within .quick-controls { display: flex; }
    .quick-control { display: grid; place-items: center; width: 44px; height: 44px; padding: 0; border: 0; border-radius: 50%; color: var(--player-text); background: transparent; cursor: pointer; }
    .quick-control:hover { background: rgba(255,255,255,.1); }
    .quick-control svg { width: 20px; height: 20px; }

    .launcher:hover { background: linear-gradient(135deg, #a5a8ff, #7070ff); }
    .launcher:active { transform: scale(0.96); }

    .launcher-star {
      color: #fff;
      font: 700 20px/1 ui-monospace, "SFMono-Regular", Menlo, monospace;
    }

    .menu {
      position: fixed;
      top: max(76px, calc(env(safe-area-inset-top) + 60px));
      right: max(16px, env(safe-area-inset-right));
      z-index: 50;
      width: min(320px, calc(100vw - 32px));
      height: calc(100dvh - 88px);
      padding: 0;
      border: 0;
      border-radius: 26px;
      background: transparent;
      box-shadow: none;
      transform-origin: top right;
      transition: opacity 160ms ease, transform 160ms var(--ease-out), visibility 160ms ease;
    }
    .nova-island-frame { display: block; width: 100%; height: 100%; border: 0; border-radius: 26px; background: transparent; }

    .menu[hidden] {
      display: block;
      visibility: hidden;
      opacity: 0;
      transform: translateY(-8px) scale(0.98);
      pointer-events: none;
    }

    .menu-header {
      min-width: 0;
      padding: 2px 4px 14px;
      border-bottom: 1px solid var(--player-border);
    }
    .island-tabs { display:grid; grid-template-columns:repeat(3,1fr); gap:4px; margin-top:12px; padding:4px; border-radius:11px; background:rgba(255,255,255,.04); }
    .island-tab { min-height:38px; border:0; border-radius:8px; color:var(--player-muted); background:transparent; font-size:12px; font-weight:700; cursor:pointer; }
    .island-tab.active { color:var(--player-text); background:rgba(139,143,255,.18); }
    .island-panel[hidden] { display:none; }
    .island-link { display:flex; align-items:center; gap:12px; min-height:50px; padding:9px 10px; border:1px solid transparent; border-radius:12px; color:var(--player-text); text-decoration:none; }
    .island-link:hover { border-color:var(--player-border); background:var(--player-surface-hover); }
    .island-link span { color:var(--player-muted); font-size:12px; }
    .island-empty { padding:28px 10px; color:var(--player-muted); text-align:center; font-size:13px; line-height:1.55; }
    .message-toast { position:fixed; z-index:80; top:max(78px,calc(env(safe-area-inset-top) + 64px)); right:max(16px,env(safe-area-inset-right)); display:flex; align-items:center; gap:11px; width:min(330px,calc(100vw - 32px)); padding:13px 15px; border:1px solid rgba(139,143,255,.35); border-radius:16px; background:rgba(17,17,34,.95); box-shadow:var(--player-shadow); opacity:0; visibility:hidden; transform:translateY(-10px) scale(.98); transition:opacity 280ms var(--ease-out),transform 300ms var(--ease-out),visibility 280ms; }
    .message-toast.is-visible { opacity:1; visibility:visible; transform:none; }
    .message-avatar { display:grid; place-items:center; width:38px; height:38px; flex:0 0 38px; border-radius:50%; background:linear-gradient(135deg,var(--player-accent),#5d5df6); font-weight:800; }
    .message-copy { min-width:0; }
    .message-copy strong,.message-copy span { display:block; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .message-copy strong { font-size:13px; }.message-copy span { margin-top:3px; color:var(--player-muted); font-size:12px; }
    .library { min-height:100dvh; overflow:auto; padding:clamp(28px,5vw,72px); background:radial-gradient(circle at 85% 0,rgba(139,143,255,.12),transparent 35%),var(--player-bg); }
    .library[hidden] { display:none; }.library-shell { width:min(1180px,100%); margin:auto; }.library-header { display:flex; align-items:end; justify-content:space-between; gap:20px; margin-bottom:28px; }.library-kicker { margin:0 0 8px; color:var(--player-accent); font-size:11px; font-weight:800; letter-spacing:.16em; text-transform:uppercase; }.library h1 { margin:0; font-size:clamp(34px,6vw,64px); letter-spacing:-.05em; }.library-sub { margin:9px 0 0; color:var(--player-muted); }.library-back { display:inline-flex; align-items:center; min-height:44px; padding:0 16px; border:1px solid var(--player-border); border-radius:999px; color:var(--player-text); text-decoration:none; font-weight:700; }.game-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(170px,1fr)); gap:16px; }.game-card { overflow:hidden; min-height:215px; border:1px solid var(--player-border); border-radius:18px; color:var(--player-text); background:var(--player-surface); text-decoration:none; transition:transform 180ms var(--ease-out),border-color 180ms; }.game-card:hover { transform:translateY(-4px); border-color:rgba(139,143,255,.55); }.game-card img { display:block; width:100%; aspect-ratio:1.22; object-fit:cover; background:#10101c; }.game-card div { padding:14px; }.game-card strong { display:block; font-size:14px; }.game-card span { display:block; margin-top:5px; color:var(--player-muted); font-size:11px; }.library-status { grid-column:1/-1; padding:60px 20px; color:var(--player-muted); text-align:center; }

    .menu-eyebrow {
      display: block;
      margin-bottom: 4px;
      color: var(--player-muted);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .menu-title {
      display: block;
      overflow: hidden;
      font-size: 18px;
      font-weight: 700;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .menu-actions {
      display: grid;
      gap: 8px;
      padding-top: 12px;
    }

    .menu-action,
    .error-action {
      display: flex;
      align-items: center;
      gap: 12px;
      min-height: 48px;
      padding: 10px 12px;
      border: 1px solid transparent;
      border-radius: 12px;
      color: var(--player-text);
      background: transparent;
      cursor: pointer;
      text-align: left;
      transition: background-color 140ms ease, border-color 140ms ease;
      touch-action: manipulation;
    }

    .menu-action:hover,
    .error-action:hover { background: var(--player-surface-hover); border-color: var(--player-border); }
    .menu-action.back { color: var(--player-danger); }

    .menu-action svg,
    .error-action svg {
      flex: 0 0 auto;
      width: 20px;
      height: 20px;
    }

    .action-copy { display: grid; gap: 1px; }
    .action-label { font-size: 14px; font-weight: 700; }
    .action-hint { color: var(--player-muted); font-size: 12px; }

    .shortcut-note {
      margin: 12px 4px 0;
      color: var(--player-muted);
      font-size: 12px;
      line-height: 1.5;
    }

    kbd {
      display: inline-grid;
      place-items: center;
      min-width: 22px;
      min-height: 22px;
      padding: 0 6px;
      border: 1px solid var(--player-border);
      border-radius: 6px;
      color: var(--player-text);
      background: rgba(255, 255, 255, 0.06);
      font: 600 11px/1 ui-monospace, SFMono-Regular, Menlo, monospace;
    }

    button:focus-visible {
      outline: 3px solid var(--player-ring);
      outline-offset: 3px;
    }

    @keyframes load {
      from { transform: translateX(-70%); }
      to { transform: translateX(115%); }
    }

    @keyframes island-pulse {
      0%, 100% { box-shadow: 0 4px 20px rgba(93, 93, 246, 0.4), 0 0 0 0 rgba(139, 143, 255, 0.5); }
      60% { box-shadow: 0 4px 20px rgba(93, 93, 246, 0.4), 0 0 0 10px rgba(139, 143, 255, 0); }
    }

    @media (max-width: 520px) {
      .launcher {
        top: max(12px, env(safe-area-inset-top));
        right: max(12px, env(safe-area-inset-right));
      }

      .menu {
        top: max(72px, calc(env(safe-area-inset-top) + 58px));
        right: 12px;
        width: calc(100vw - 24px);
      }
      .library { padding:24px 16px; }.library-header { align-items:start; flex-direction:column; }.game-grid { grid-template-columns:repeat(2,minmax(0,1fr)); gap:11px; }.game-card { min-height:180px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        scroll-behavior: auto !important;
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>
  <main class="player" id="player">
    <iframe
      class="game-frame"
      id="game-frame"
      title="Game"
      allow="autoplay; fullscreen; gamepad"
      referrerpolicy="no-referrer"
    ></iframe>

    <section class="loading" id="loading" aria-live="polite">
      <div class="loading-card">
        <svg class="nova-mark" viewBox="0 0 100 100" aria-hidden="true"><path d="M50 3C50 3 43 43 3 50C43 57 50 97 50 97C50 97 57 57 97 50C57 43 50 3 50 3Z" fill="currentColor"/></svg>
        <div>
          <h1 id="loading-title">Loading game</h1>
          <p>Nova Game Mode</p>
        </div>
        <div class="progress-track" aria-hidden="true"><div class="progress-bar"></div></div>
      </div>
    </section>

    <section class="error-state" id="error-state" hidden role="alert">
      <div class="error-card">
        <svg class="nova-mark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v6"/><path d="M12 17h.01"/></svg>
        <div>
          <h1>Game unavailable</h1>
          <p id="error-message">Nova could not open this local game.</p>
        </div>
        <button class="error-action" id="error-back" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>
          <span class="action-label">Back to Games</span>
        </button>
      </div>
    </section>

    <div class="island-dock" id="island-dock">
      <div class="quick-controls" aria-label="Quick game controls">
        <button class="quick-control" id="mute-quick" type="button" aria-label="Mute game"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M11 5 6 9H2v6h4l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M18 6a9 9 0 0 1 0 12"/></svg></button>
        <button class="quick-control" id="fullscreen-quick" type="button" aria-label="Enter fullscreen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M8 3H3v5M16 3h5v5M8 21H3v-5M16 21h5v-5"/></svg></button>
      </div>
      <button class="launcher" id="launcher" type="button" aria-label="Open Nova Island" aria-expanded="false" aria-controls="game-menu"><span class="launcher-star" aria-hidden="true">✦</span></button>
    </div>

    <aside class="menu" id="game-menu" hidden aria-label="Nova Island"><iframe class="nova-island-frame" id="nova-island-frame" title="Nova Island" src="/website/html/index.html?islandEmbed=1"></iframe></aside>
    <button id="back-button" type="button" hidden>Back to Games</button><button id="restart-button" type="button" hidden>Restart</button><button id="fullscreen-button" type="button" hidden><span id="fullscreen-label">Fullscreen</span></button><button id="mute-button" type="button" hidden><span id="mute-label">Mute</span></button>
    <div class="message-toast" id="message-toast" role="status" aria-live="polite"><div class="message-avatar" id="message-avatar">N</div><div class="message-copy"><strong id="message-from">Nova message</strong><span id="message-text">You have a new message</span></div></div>
  </main>
  <main class="library" id="library" hidden><div class="library-shell"><header class="library-header"><div><p class="library-kicker">Nova Games Player</p><h1>Local games</h1><p class="library-sub" id="library-count">Loading your library…</p></div><a class="library-back" href="/website/html/index.html">Back to Nova</a></header><section class="game-grid" id="game-grid" aria-live="polite"><div class="library-status">Loading local games…</div></section></div></main>

  <script>
    (function () {
      'use strict';

      var games = {
        'pixel-shooter': { name: 'Pixel Shooter', src: '/website/games/pixel-shooter/' },
        'fnaf-2': { name: 'FNAF 2', src: '/website/games/fnaf-2/' },
        'brawl-stars': { name: 'Brawl Stars', src: '/website/games/brawl-stars/' },
        'brawl-guys': { name: 'Brawl Guys', src: '/website/games/brawl-guys/' },
        'retro-bowl': { name: 'Retro Bowl', src: '/website/games/retro-bowl/' },
        'super-liquid-soccer': { name: 'Super Liquid Soccer', src: '/website/games/super-liquid-soccer/' },
        'basket-bros': { name: 'Basket Bros', src: '/website/games/basket-bros/' },
        'wrestle-bros': { name: 'Wrestle Bros', src: '/website/games/wrestle-bros/' },
        'time-shooter-2': { name: 'Time Shooter 2', src: '/website/games/time-shooter-2/' },
        'time-shooter-3': { name: 'Time Shooter 3: SWAT', src: '/website/games/time-shooter-3/' },
        'basket-random': { name: 'Basket Random', src: '/website/games/basket-random/' },
        'jetpack-joyride': { name: 'Jetpack Joyride', src: '/website/games/jetpack-joyride/' },
        'among-us': { name: 'Among Us', src: '/website/games/among-us/' },
        'bitlife': { name: 'BitLife', src: '/website/games/bitlife/' },
        'slope': { name: 'Slope', src: '/website/games/slope/' },
        'rocket-league': { name: 'Rocket Soccer', src: '/website/games/rocket-league/' },
        'cookie-clicker': { name: 'Cookie Clicker', src: '/website/games/cookie-clicker/' },
        'subway-surfers': { name: 'Subway Surfers: San Francisco', src: '/website/games/subway-surfers/' },
        'stickman-hook': { name: 'Stickman Hook', src: '/website/games/stickman-hook/' },
        'tunnel-rush': { name: 'Tunnel Rush', src: '/website/games/tunnel-rush/' },
        'tunnel-rush-2': { name: 'Tunnel Rush 2', src: '/website/games/tunnel-rush-2/' },
        'learn-to-fly': { name: 'Learn to Fly', src: '/website/games/learn-to-fly/' },
        'moto-x3m': { name: 'Moto X3M', src: '/website/games/moto-x3m/' }
        ,'paper-2-io': { name: 'Paper.io 2', src: '/website/games/paper-2-io/' }
        ,'baseball-bros': { name: 'Baseball Bros', src: '/website/games/baseball-bros/' }
        ,'speed-stars': { name: 'Speed stars', src: '/website/games/speed-stars/' }
        ,'space-waves': { name: 'Space Waves', src: '/website/games/space-waves/' }
        ,'doom': { name: 'DOOM', src: '/website/games/doom/' }
        ,'monkey-mart': { name: 'Monkey Mart', src: '/website/games/monkey-mart/' }
      };

      var params = new URLSearchParams(window.location.search);
      var game = games[params.get('game') || ''];
      var frame = document.getElementById('game-frame');
      var loading = document.getElementById('loading');
      var errorState = document.getElementById('error-state');
      var errorMessage = document.getElementById('error-message');
      var launcher = document.getElementById('launcher');
      var menu = document.getElementById('game-menu');
      var player = document.getElementById('player');
      var dock = document.getElementById('island-dock');
      var muted = false;
      var loadTimer;
      var messageTimer;

      function goBack() {
        if (window.history.length > 1) window.history.back();
        else window.location.assign('/website/html/index.html');
      }

      function showError(message) {
        window.clearTimeout(loadTimer);
        loading.classList.add('is-hidden');
        errorMessage.textContent = message;
        errorState.hidden = false;
        launcher.hidden = true;
      }

      function setMenu(open, restoreFocus) {
        menu.hidden = !open;
        launcher.setAttribute('aria-expanded', String(open));
        launcher.setAttribute('aria-label', open ? 'Close Nova Island' : 'Open Nova Island');
        if (open) document.getElementById('nova-island-frame').focus();
        else if (restoreFocus !== false) launcher.focus();
      }

      function toggleFullscreen() {
        if (document.fullscreenElement) {
          document.exitFullscreen().catch(function () {});
        } else if (player.requestFullscreen) {
          player.requestFullscreen().catch(function () {});
        }
      }

      function applyMute() {
        try {
          var child = frame.contentWindow;
          var media = child.document.querySelectorAll('audio, video');
          media.forEach(function (element) { element.muted = muted; });
          if (child.Howler && typeof child.Howler.mute === 'function') child.Howler.mute(muted);
          child.postMessage({ type: 'nova:game-audio', muted: muted }, window.location.origin);
        } catch (error) {}
        document.getElementById('mute-button').setAttribute('aria-pressed', String(muted));
        document.getElementById('mute-label').textContent = muted ? 'Unmute' : 'Mute';
      }

      function updatePointerCapture() {
        var captured = !!document.pointerLockElement;
        try { captured = captured || !!frame.contentDocument.pointerLockElement; } catch (error) {}
        dock.classList.toggle('is-captured', captured);
        if (captured) setMenu(false, false);
      }

      function showMessage(detail) {
        detail = detail || {};
        var from = String(detail.from || detail.peer || 'Nova friend');
        var toast = document.getElementById('message-toast');
        document.getElementById('message-from').textContent = from;
        document.getElementById('message-text').textContent = String(detail.text || detail.body || 'You have a new message');
        document.getElementById('message-avatar').textContent = (from.charAt(0) || 'N').toUpperCase();
        toast.classList.add('is-visible');
        window.clearTimeout(messageTimer);
        messageTimer = window.setTimeout(function () { toast.classList.remove('is-visible'); }, 4800);
      }

      function renderLibrary() {
        player.hidden = true;
        document.getElementById('library').hidden = false;
        document.body.style.overflow = 'auto';
        fetch('/website/data/games.json').then(function (response) {
          if (!response.ok) throw new Error('library');
          return response.json();
        }).then(function (allGames) {
          var localGames = allGames.filter(function (item) {
            return item.local === true || /main\.nova-7\.pages\.dev\/website\/games\//.test(item.url || item.link || '');
          });
          var grid = document.getElementById('game-grid');
          grid.innerHTML = '';
          localGames.forEach(function (item) {
            var path = new URL(item.url || item.link, window.location.origin).pathname;
            var parts = path.split('/').filter(Boolean);
            var card = document.createElement('a');
            card.className = 'game-card';
            card.href = '/website/html/game.html?game=' + encodeURIComponent(parts[parts.length - 1]);
            var image = document.createElement('img');
            image.src = item.image || '/website/assets/media/icons/controller.webp';
            image.alt = '';
            image.loading = 'lazy';
            var copy = document.createElement('div');
            var title = document.createElement('strong');
            title.textContent = item.name;
            var label = document.createElement('span');
            label.textContent = 'Play locally';
            copy.append(title, label);
            card.append(image, copy);
            grid.appendChild(card);
          });
          document.getElementById('library-count').textContent = localGames.length + ' games installed locally';
          if (!localGames.length) grid.innerHTML = '<div class="library-status">No local games are installed yet.</div>';
        }).catch(function () {
          document.getElementById('library-count').textContent = 'Library unavailable';
          document.getElementById('game-grid').innerHTML = '<div class="library-status">Nova could not load the local library.</div>';
        });
      }

      document.getElementById('back-button').addEventListener('click', goBack);
      document.getElementById('error-back').addEventListener('click', goBack);
      document.getElementById('restart-button').addEventListener('click', function () {
        setMenu(false);
        loading.classList.remove('is-hidden');
        frame.src = game.src;
      });
      document.getElementById('fullscreen-button').addEventListener('click', toggleFullscreen);
      document.getElementById('mute-button').addEventListener('click', function () {
        muted = !muted;
        applyMute();
      });
      document.getElementById('mute-quick').addEventListener('click', function () { muted = !muted; applyMute(); });
      document.getElementById('fullscreen-quick').addEventListener('click', toggleFullscreen);
      launcher.addEventListener('click', function () { setMenu(menu.hidden); });

      document.addEventListener('pointermove', function (event) {
        if (dock.classList.contains('is-captured')) return;
        dock.classList.toggle('is-near', event.clientX > window.innerWidth - 210 && event.clientY < 150);
      });
      dock.addEventListener('pointerleave', function () { dock.classList.remove('is-near'); });
      document.addEventListener('pointerlockchange', updatePointerCapture);

      document.querySelectorAll('[data-island-tab]').forEach(function (tab) {
        tab.addEventListener('click', function () {
          document.querySelectorAll('[data-island-tab]').forEach(function (item) { item.classList.toggle('active', item === tab); });
          document.querySelectorAll('[data-island-panel]').forEach(function (panel) { panel.hidden = panel.getAttribute('data-island-panel') !== tab.getAttribute('data-island-tab'); });
        });
      });
      document.addEventListener('nova:message-island-test', function (event) { showMessage(event.detail); });
      window.addEventListener('message', function (event) {
        if (!event.data) return;
        if (event.data.type === 'nova:message') showMessage(event.data);
        if (event.data.type === 'nova:island-close') setMenu(false, false);
        if (event.data.type === 'nova:island-page') {
          if (event.data.page === 'games') window.location.assign('/website/html/game.html');
          else window.location.assign('/website/html/index.html?page=' + encodeURIComponent(event.data.page || 'home'));
        }
      });
      window.NovaGamesPlayer = { showMessage: showMessage };

      document.addEventListener('fullscreenchange', function () {
        document.getElementById('fullscreen-label').textContent = document.fullscreenElement ? 'Exit Fullscreen' : 'Fullscreen';
      });

      document.addEventListener('pointerdown', function (event) {
        if (!menu.hidden && !menu.contains(event.target) && event.target !== launcher) setMenu(false);
      });

      window.addEventListener('blur', function () {
        window.setTimeout(function () {
          if (!menu.hidden && document.activeElement === frame) setMenu(false, false);
        }, 0);
      });

      document.addEventListener('keydown', function (event) {
        if (event.key === 'Escape' && !document.fullscreenElement) {
          event.preventDefault();
          setMenu(menu.hidden);
        } else if (event.key.toLowerCase() === 'f' && !event.metaKey && !event.ctrlKey && !event.altKey) {
          event.preventDefault();
          toggleFullscreen();
        }
      });

      if (!game) {
        renderLibrary();
        return;
      }

      document.title = game.name + ' — Nova Game Mode';
      frame.title = game.name;
      document.getElementById('loading-title').textContent = 'Loading ' + game.name;
      frame.addEventListener('load', function () {
        window.clearTimeout(loadTimer);
        loading.classList.add('is-hidden');
        if (muted) applyMute();
        try { frame.contentDocument.addEventListener('pointerlockchange', updatePointerCapture); } catch (error) {}
        try { frame.contentWindow.focus(); } catch (error) {}
      });
      frame.addEventListener('error', function () { showError('Nova could not load ' + game.name + '.'); });
      loadTimer = window.setTimeout(function () {
        loading.classList.add('is-hidden');
      }, 15000);
      frame.src = game.src;
    }());
  </script>
</body>
</html>
