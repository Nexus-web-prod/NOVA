<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nova Eaglercraft</title>
  <style>
    html, body, iframe { width: 100%; height: 100%; margin: 0; border: 0; }
    body { display: grid; place-items: center; overflow: hidden; background: #000; color: #fff; font: 600 16px system-ui, sans-serif; }
    .loading { text-align: center; }
    .loading small { display: block; margin-top: 8px; color: #b8b8b8; font-weight: 400; }
  </style>
</head>
<body>
  <div class="loading" id="loading" role="status">Loading Nova Eaglercraft…<small>Preparing the local game</small></div>
  <script>
    (async function () {
      var parts = ['game.part.00', 'game.part.01', 'game.part.02', 'game.part.03'];

      function installKeyboardFocusRecovery(frame) {
        function recoverFocus() {
          try {
            var win = frame.contentWindow;
            var doc = frame.contentDocument;
            if (!win || !doc || doc.hidden) return;

            var active = doc.activeElement;
            var tag = active && active.tagName ? active.tagName.toLowerCase() : '';
            var editing = tag === 'input' || tag === 'textarea' || tag === 'select' ||
              (active && active.isContentEditable);

            // Never steal focus from chat, menus, or another text-editing control.
            if (editing) return;

            // Eaglercraft can occasionally lose keyboard focus while the server
            // finishes joining. Restore the existing game's window/document focus.
            if (!active || active === doc.body || active === doc.documentElement) {
              win.focus();
              if (doc.body && typeof doc.body.focus === 'function') doc.body.focus();
            }
          } catch (_) {}
        }

        frame.addEventListener('load', function () {
          recoverFocus();
          setTimeout(recoverFocus, 100);
          setTimeout(recoverFocus, 500);
          setTimeout(recoverFocus, 1500);
          setTimeout(recoverFocus, 3000);
        });

        // Clicking the existing game always restores its normal keyboard focus.
        frame.addEventListener('pointerdown', function () {
          setTimeout(recoverFocus, 0);
        });

        // Recover from the intermittent server-join focus loss without replacing
        // Eaglercraft's input handlers or touching its saved-server data.
        setInterval(recoverFocus, 1000);
      }

      try {
        var responses = await Promise.all(parts.map(function (part) {
          return fetch(part).then(function (response) {
            if (!response.ok) throw new Error('Missing game data');
            return response.arrayBuffer();
          });
        }));
        var size = responses.reduce(function (total, part) { return total + part.byteLength; }, 0);
        var bytes = new Uint8Array(size);
        var offset = 0;
        responses.forEach(function (part) { bytes.set(new Uint8Array(part), offset); offset += part.byteLength; });
        var game = new Blob([bytes], { type: 'text/html' });
        var frame = document.createElement('iframe');
        frame.title = 'Nova Eaglercraft';
        frame.allow = 'autoplay; fullscreen; gamepad';
        installKeyboardFocusRecovery(frame);
        frame.src = URL.createObjectURL(game);
        document.getElementById('loading').replaceWith(frame);
      } catch (error) {
        document.getElementById('loading').textContent = 'Nova Eaglercraft could not load. Refresh and try again.';
      }
    }());
  </script>
</body>
</html>
