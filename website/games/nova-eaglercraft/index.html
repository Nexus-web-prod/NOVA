<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nova Eaglercraft</title>
  <style>
    html, body, iframe { width: 100%; height: 100%; margin: 0; border: 0; }
    body { display: grid; place-items: center; overflow: hidden; background: #000; color: #fff; font: 600 16px system-ui, sans-serif; }
    .loading { text-align: center; }
    .loading small { display: block; margin-top: 8px; color: #b8b8b8; font-weight: 400; }
  </style>
</head>
<body>
  <div class="loading" id="loading" role="status">Loading Nova Eaglercraft…<small>Preparing the local game</small></div>
  <script>
    (async function () {
      var parts = ['game.part.00', 'game.part.01', 'game.part.02', 'game.part.03'];

      function installKeyboardFocusRecovery() {
        // The Nova Games Player already provides the outer game iframe.
        // Navigate that existing frame directly to the streamed game document;
        // do not create a second nested iframe, which can be rejected by
        // browser frame/security policies on some Chromebook builds.
      }

      try {
        // The worker streams the split HTML directly. Do not rebuild the full
        // game in ArrayBuffers/Blob memory: that can OOM lower-memory Chromebooks.
        var loading = document.getElementById('loading');
        loading.textContent = 'Loading Nova Eaglercraft…';
        window.location.replace('game.html?v=20261007-eagler-stream2');
      } catch (error) {
        document.getElementById('loading').textContent = 'Nova Eaglercraft could not load. Refresh and try again.';
      }
    }());
  </script>
</body>
</html>
